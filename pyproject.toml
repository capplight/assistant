[project]
name = "assistant"
version = "0.1.0"
description = "Telegram-бот «память поездки»: собирает рилсы, скрины и брони, напоминает на месте"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "geoalchemy2>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.78",
    "pyyaml>=6",  # ai/routes.yaml
    "tzdata>=2024.1",  # Windows has no system tz database
    # Ingest: local document text extraction (spec 2.2; not PyMuPDF: AGPL)
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-calamine>=0.3",
]

[project.optional-dependencies]
# Fallback / extra AI providers; each SDK is imported only inside its adapter.
ai = [
    "openai>=1.60",
    "google-genai>=1.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "openpyxl>=3.1",  # builds xlsx test fixtures
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant.ai" = ["routes.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs a real Postgres (DATABASE_URL); skipped otherwise"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
