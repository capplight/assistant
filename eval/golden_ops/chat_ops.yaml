# Ф-95 phase 1 golden set (docs/spec/proposals/chat-full-control.md §5 «Тесты и золотой набор»):
# phrase → which operation code runs, on which object, with which arguments. Synthetic data only.
# Runner: tests/chat/test_f95_golden.py (offline, no DB, no model: model cases carry the tool call
# the model gave — a cassette — and code's checks decide). Clock: Thu 12 Nov 2026 10:00 Almaty.
#
# objects: kind task | event | reminder | expense; `at` local "YYYY-MM-DD HH:MM" for event /
# reminder; `list` shopping | todo; `done`, `repeat`, `amount`, `day`.
# expect.route: code (read by code, no model) | model (a domain tool call checked by code) |
#   question (no change tools) | refused (a call code turns down: nothing changes) |
#   none (code does not take it; the usual way).
# expect.op / target / args: the operation, the title of the object it changes, part of its args;
# `local`: the new moment (local) a move gives; `ask`: a question with choices first; `confirm`: «Да»
# first (Ф-95 (3)).

