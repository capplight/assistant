name: backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts

  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # WeasyPrint (КП PDF, week 14) needs Pango; with CI set, the real-render test must run
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[dev]"
      # Failed test names and reasons also go out as annotations, readable without log access.
      - name: Unit tests
        run: |
          set -o pipefail
          pytest -q -m "not db" -rf 2>&1 | tee pytest-unit.txt
      - name: Report failures as annotations
        if: failure()
        run: grep -E '^(FAILED|ERROR) ' pytest-unit.txt | cut -c1-900 | sed 's/^/::error::/' || true

  # Week 17 (spec 5.8): the synthetic golden set against recorded cassettes - offline, no keys.
  # It proves the harness and the code checks; real thresholds need `golden-real` (a self-hosted
  # runner in KZ with the anonymised set and provider keys; not set up yet, docs/ops/golden.md).
  # Only metrics go to the artifact, never case texts.
  golden-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Golden (cassettes)
        run: python -m assistant.ai.golden --json golden-metrics.json
      - name: Metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-synthetic-metrics
          path: golden-metrics.json
          if-no-files-found: ignore

  # Required for merge (spec 3-engineering 2.3). The image has pgvector + pg_trgm, no PostGIS:
  # migration 0001 then skips places.geom and the geo tests skip themselves.
  backend-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: assistant
          POSTGRES_DB: assistant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://assistant:assistant@localhost:5432/assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: DB tests
        run: pytest -q -m db -rs
      - name: Downgrade one step and upgrade again
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic current
