plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alarms'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.alarms"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core:1.13.1"
}
